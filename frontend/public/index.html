<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content Security Policy.

      The point of this policy is script-src. Everything else here is tidying;
      script-src is the control that decides whether an injected string can
      become running code in a console that holds FIR records. The build emits
      no inline script — CRA's runtime chunk is a file, not a <script> body —
      so this can be a real allowlist with no 'unsafe-inline' and no hashes to
      keep in sync. Adding 'unsafe-inline' here later would quietly undo the
      only line in this file that is load-bearing.

      Where it is deliberately loose, and why:

      img-src allows any https origin. Mapillary serves street-level imagery
      from rotating CDN hostnames that are not knowable in advance, so an
      allowlist would either be wrong today or wrong next month, and a map that
      silently stops loading photos is a bug nobody reports. Images cannot
      execute; this is the cheap half of the trade.

      style-src allows 'unsafe-inline' because Leaflet and the chart libraries
      inject <style> at runtime. Style injection is a defacement and exfil-via-
      CSS risk, not an execution one, and locking it down would mean hashing
      third-party stylesheets on every dependency bump.

      NOT expressible here: frame-ancestors, which browsers ignore in a meta
      tag. Catalyst already sends X-Frame-Options: SAMEORIGIN on every
      response, so clickjacking is covered by the platform rather than by this
      file.

      script-src allows map-data-development.zohostratus.in because
      src/data/hierarchyStore.js imports policeHierarchy.js, crimeData2025.js
      and stateInfo.js from that bucket AS EXECUTABLE MODULES at runtime. That
      is worth naming plainly: anything that can write to that bucket can run
      JavaScript in every signed-in officer's browser, and no policy here can
      change that — CSP can only say which origin is trusted, not what it
      serves. The bucket needs a public GetObject rule for reads, so the thing
      to keep verifying is that its WRITE permissions stay closed. Serving
      those three files as JSON instead of JS would remove the exposure
      entirely and let this origin come back out of script-src.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://static.zohocdn.com https://map-data-development.zohostratus.in;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        media-src 'self' blob: data:;
        connect-src 'self' https://static.zohocdn.com https://*.zohostratus.in
          https://maps.googleapis.com https://graph.mapillary.com
          https://nominatim.openstreetmap.org https://api.postalpincode.in
          https://ifsc.razorpay.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-src 'none';
        upgrade-insecure-requests
      "
    />
    <!--
      The Mapillary token and the Google Street View key travel in query
      strings, so a full referrer would hand them to every site an officer
      clicks through to.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Matches the manifest's theme_color: the browser chrome and the app's
         own header should not disagree once it is installed. -->
    <meta name="theme-color" content="#1d4ed8" />
    <!-- Installed on iOS, where the manifest's display mode is not honoured. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sentinel" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Sentinel — Crime Analytics Intelligence Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Catalyst Web SDK.
         THE VERSION IS LOAD-BEARING, and 4.0.0 is why Sign out did nothing.
         Its constructSignOutUrl builds the legacy global-logout shape
           <accounts-domain>/logout?logout=true&PROJECT_ID=<ZAID>&serviceurl=...
         which Zoho IAM now answers with 302 -> /accounts/clienterror?error=invalid_portal
         and a dead end. The redirect never reaches the app, the HttpOnly session
         cookie is never cleared, so the officer lands back inside a live session --
         "Signing out..." followed by nothing at all.
         4.6.2 (the build Catalyst itself serves on this deployment's own login page)
         builds the portal-scoped shape
           /accounts/p/<ZAID>/logout?servicename=ZohoCatalyst&serviceurl=...
         which answers 302 -> the app and does end the session. Every SDK call this
         app makes exists unchanged in both builds; see src/__smoke__/sdkversion.test.js,
         which fails if this pin ever slips back below the fix. -->
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.2/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
