name: Sentinel — CI / Deploy to Catalyst

# Tests and the production build run on every push and pull request. Deployment
# is a separate job that only runs for main, so a red build can never reach the
# officers using the platform.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to main while a deploy is running would race it onto the same
# environment. Queue instead, and never cancel a deploy midway.
concurrency:
  group: sentinel-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  verify:
    name: Tests, lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            react-app/package-lock.json
            functions/rag/package-lock.json

      # ── Backend ────────────────────────────────────────────────────────
      - name: Install function dependencies
        working-directory: functions/rag
        run: npm ci --no-audit --no-fund

      - name: Syntax-check the function
        working-directory: functions/rag
        run: node --check index.js

      - name: Run backend test suites
        working-directory: functions/rag
        # Every *.test.js in the function, so a new suite is picked up without
        # editing this workflow. Each exits non-zero on failure.
        run: |
          status=0
          for t in *.test.js; do
            echo "── $t"
            node "$t" || status=1
          done
          exit $status

      # The benchmark is a gate, not a report: it recomputes its ground truth
      # from datastore_export/ on every run and exits non-zero if a clearance
      # field leaks, an unsafe query is accepted, a fabricated case number gets
      # through or an officer is wrongly refused. Its output is printed here so
      # the numbers are visible in the build log rather than only on someone's
      # laptop. bench.test.js (run above) separately proves the gates can fail.
      - name: Benchmark — accuracy, leakage and abstention
        run: node functions/rag/bench/run.js

      # ── Frontend ───────────────────────────────────────────────────────
      - name: Install web dependencies
        working-directory: react-app
        # --legacy-peer-deps because react-scripts 5 and zcatalyst-cli-plugin-react
        # declare conflicting peers around typescript; npm 7+ refuses the tree
        # without it. The lockfile already pins the resolution that works.
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Lint application source
        working-directory: react-app
        # A real gate on application code — it is clean, so a new error stops
        # the build. src/__smoke__ is excluded: its 47 findings are all
        # testing-library style preferences (no-node-access, prefer-find-by)
        # rather than correctness, and gating on them would block every
        # unrelated change. Worth cleaning up separately.
        run: npx eslint src --ext .js --ignore-pattern '__smoke__'

      # Accessibility gate. Sentinel is a government tool, so an unlabelled
      # control is a procurement problem as well as an exclusion; this is the
      # part that regresses silently, because nobody who can see the screen
      # notices a button a screen reader announces as just "button".
      - name: Accessibility gate
        run: |
          node scripts/a11y-check.test.js
          node scripts/a11y-check.js

      - name: Lint smoke tests (advisory)
        working-directory: react-app
        continue-on-error: true
        run: npx eslint src/__smoke__ --ext .js

      - name: Build the web client
        working-directory: react-app
        env:
          CI: false # CRA promotes warnings to errors under CI; the build is clean but noisy
          # react-app/.env is gitignored, so these reach a local build but never
          # reached CI — every deployed bundle baked in empty strings and the
          # Crime Map's station panel showed "No image provider configured" for
          # EVERY station, while working fine on the developer's machine.
          #
          # CRA inlines REACT_APP_* at build time, so a client-side key is public
          # by construction; these are not secrets in the usual sense. Keep the
          # Google key restricted by HTTP referrer in the Cloud console, and the
          # Mapillary token scoped to reads.
          REACT_APP_GOOGLE_MAPS_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_KEY }}
          REACT_APP_MAPILLARY_TOKEN: ${{ secrets.REACT_APP_MAPILLARY_TOKEN }}
        # `npm run build`, never `react-scripts build` directly: the postbuild
        # step copies index.html to 404.html, which is the SPA fallback Catalyst
        # serves for client routes. Without it a hard refresh on /app/personnel
        # shows Catalyst's own 404 page.
        run: npm run build

      - name: Confirm the SPA fallback was produced
        working-directory: react-app
        run: test -f build/404.html || (echo "postbuild did not run — 404.html missing" && exit 1)

      - name: Record the built bundle name
        id: bundle
        working-directory: react-app
        run: |
          name=$(ls build/static/js/main.*.js | head -1 | xargs basename)
          echo "main_js=$name" >> "$GITHUB_OUTPUT"
          echo "Built $name"

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: react-app/build
          retention-days: 5

    outputs:
      main_js: ${{ steps.bundle.outputs.main_js }}

  deploy:
    name: Deploy to Catalyst
    needs: verify
    # Pull requests build and test but never deploy.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The client target in catalyst.json is react-app/build, which is
      # gitignored — so the deploy uses the artifact the verify job produced
      # rather than rebuilding and risking a different bundle than the one
      # the tests ran against.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: react-app/build

      - name: Install function dependencies
        working-directory: functions/rag
        run: npm ci --omit=dev --no-audit --no-fund

      # catalyst-config.json is gitignored (it can hold secrets), but the CLI
      # refuses to deploy a function without one — it carries the stack, the
      # advancedio type and the entry point. So CI builds it from the tracked
      # template.
      #
      # env_variables is stripped deliberately, and this is the important part:
      # deploying with an env_variables map OVERWRITES what is set in the
      # Catalyst console. Every secret this function needs — the Zoho OAuth
      # credentials, GROQ_API_KEY, ANTHROPIC_API_KEY, SMTP — lives only in the
      # console. Shipping the template's placeholder values would replace real
      # keys with the string "<groq-api-key>" and break the assistant on the
      # next push. Omitting the key entirely leaves the console values alone,
      # which is exactly what the local config does.
      - name: Generate the function deployment config
        working-directory: functions/rag
        run: |
          node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync("catalyst-config.template.json", "utf8"));
            delete t.deployment.env_variables;
            fs.writeFileSync("catalyst-config.json", JSON.stringify(t, null, 2));
            console.log(JSON.stringify(t));
          '

      - name: Install the Catalyst CLI
        run: npm install -g zcatalyst-cli

      # The CLI ignores .catalystrc entirely when CI=true — it takes the org and
      # project from the environment or not at all. Both ids are already public
      # (they are in the committed .catalystrc and in the app's own URL), so
      # they are read from that file rather than duplicated into secrets.
      - name: Resolve the Catalyst project
        id: ctx
        run: |
          node -e '
            const rc = JSON.parse(require("fs").readFileSync(".catalystrc", "utf8"));
            const p = rc.projects.find((x) => x.idx === rc.actives.project);
            const e = p.env.find((x) => x.idx === rc.actives.env);
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            out.write(`project_id=${p.id}\n`);
            out.write(`org_id=${e.id}\n`);
            console.log(`Deploying to ${p.name} / ${e.name} (project ${p.id}, org ${e.id})`);
          '

      - name: Deploy functions and client
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_PROJECT_ID: ${{ steps.ctx.outputs.project_id }}
          CATALYST_ORG: ${{ steps.ctx.outputs.org_id }}
          # Without a local config store the CLI defaults to the US data centre
          # and sends the refresh token to the wrong accounts host, which comes
          # back as a bare "Authentication failure". This project lives on the
          # India DC — see the .catalystserverless.in hostname.
          CATALYST_ACTIVE_DC: in
        # The CLI has printed a fatal error and still exited 0 — "Org and
        # Project Id cannot be empty" came out of a green step, which is how a
        # deploy silently shipped nothing. Its output is inspected rather than
        # its exit code.
        run: |
          set -o pipefail
          catalyst deploy --only functions,client 2>&1 | tee deploy.log
          if grep -qE '✖|cannot be empty' deploy.log; then
            echo "::error::The Catalyst CLI reported an error (see the log above) despite its exit code."
            exit 1
          fi

      # Catalyst deploys have silently no-opped before, reporting success while
      # shipping nothing. Success is therefore asserted against the live site,
      # not against the CLI's exit code.
      - name: Verify the deploy actually landed
        env:
          EXPECTED: ${{ needs.verify.outputs.main_js }}
          APP_URL: https://sentinel-60073599957.development.catalystserverless.in/app/index.html
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            live=$(curl -fsSL "$APP_URL" | grep -o 'main\.[a-z0-9]*\.js' | head -1 || true)
            echo "attempt $attempt: live=$live expected=$EXPECTED"
            [ "$live" = "$EXPECTED" ] && echo "Deploy verified." && exit 0
            sleep 20
          done
          echo "::error::Live bundle is $live but $EXPECTED was deployed — the deploy did not land."
          exit 1

      # Deploying with an env_variables map overwrites the Catalyst console's
      # values. The config generated above omits the key so the console wins,
      # but "the deploy did not clear the secrets" is an assumption worth
      # testing rather than trusting: an assistant whose GROQ_API_KEY was wiped
      # still starts and still answers 200, having silently lost every model
      # lane. The health route reports which providers are configured (never a
      # value), so the failure is caught here rather than by an officer.
      - name: Verify the function still has its provider keys
        env:
          HEALTH: https://sentinel-60073599957.development.catalystserverless.in/server/rag/health
        run: |
          body=$(curl -fsS -X POST "$HEALTH" -H 'Content-Type: application/json' -d '{}')
          echo "$body"
          echo "$body" | grep -q '"groq":true' \
            || (echo "::error::GROQ_API_KEY is missing after deploy — the console env vars were cleared." && exit 1)
          echo "$body" | grep -q '"rag":true' \
            || echo "::warning::RAG credentials are not set — knowledge-base answers will fail."

      - name: Verify the API rejects anonymous callers
        env:
          API: https://sentinel-60073599957.development.catalystserverless.in/server/rag/
        # A smoke test of the security gate: every route requires a session, so
        # an unauthenticated POST must be refused. A 200 here means the gate is
        # gone and officer data is reachable without signing in.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API" \
            -H 'Content-Type: application/json' -d '{"query":"ping"}')
          echo "anonymous POST → HTTP $code"
          [ "$code" = "401" ] || (echo "::error::Expected 401, got $code" && exit 1)
